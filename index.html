<!DOCTYPE html>
<html lang="de" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#020617" />
  <title>BWS+ Fitness – Workout Tracker</title>

  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            surface:   '#020617',
            panel:     '#0f172a',
            panel2:    '#1e293b',
            line:      '#334155',
            lineSoft:  '#1e293b',
            accent:    { DEFAULT: '#0ea5e9', hi: '#38bdf8', 400: '#38bdf8', 500: '#0ea5e9', 600: '#0284c7' },
            success:   '#10b981',
            successInk:'#022c22',
            warn:      '#f59e0b',
            drop:      '#a78bfa',
            danger:    '#f87171',
          },
        },
      },
    };
  </script>

  <link rel="stylesheet" href="/style.css" />
</head>
<body class="bg-surface text-slate-200 antialiased min-h-screen">

  <!-- Auth-Bereich (Login/Registrieren) -->
  <div id="auth-root" class="hidden"></div>

  <!-- App-Bereich (Workout-Liste / Workout / …) -->
  <div id="dashboard" class="hidden"></div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
